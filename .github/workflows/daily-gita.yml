name: Daily Gita Pipeline

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  trigger-gita:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Gita API
        run: |
          echo "🚀 Triggering Gita Pipeline..."

          for i in {1..3}
          do
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "${{ secrets.APP_URL }}/api/generate?channel=gita" \
              -H "Authorization: Bearer ${{ secrets.API_KEY }}")

            echo "Response: $response"

            if [ "$response" -eq 200 ]; then
              echo "✅ Success"
              exit 0
            fi

            sleep 10
          done

          echo "❌ Failed"
          exit 1