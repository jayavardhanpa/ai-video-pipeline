name: Daily Gita Pipeline

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

env:
  CHANNEL: gita
  HOOK_STYLE: emotional
      
jobs:
  trigger-gita:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Gita API
        run: |
          echo "🚀 Triggering Gita Pipeline..."

          for i in {1..3}
          do
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "${{ secrets.APP_URL }}/api/generate?channel=${{ env.CHANNEL }}&hook_style=${{ env.HOOK_STYLE }}" \
              -H "Authorization: Bearer ${{ secrets.API_KEY }}")

            echo "Response: $response"

            if [ "$response" -eq 200 ]; then
              echo "✅ Success"
              exit 0
            fi

            sleep 10
          done

          echo "❌ Failed"
          exit 1

      - name: Health Check
        run: |
          echo "Checking API health..."

          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.APP_URL }}/health")

          echo "Health Response: $response"

          if [ "$response" -ne 200 ]; then
            echo "❌ Health check failed!"
            exit 1